# SwiftLint Configuration for StrideSync iOS

disabled_rules:
  - trailing_whitespace
  - line_length
  - todo
  - identifier_name
  - type_name

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - yoda_condition

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData

line_length:
  warning: 160
  error: 220
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 350
  error: 600

reporter: "xcode"

