name: StrideSync CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Swift 6 / macOS Runner)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build StrideSync Package
        run: swift build -v

      - name: Run Test Suite (14 Unit Tests across 9 Suites)
        run: swift test -v --parallel

      - name: Run Demo Simulation Executable
        run: swift run StrideSyncDemo
